<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영화 상세 페이지</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />
  <link href="/css/detail_page.css" rel="stylesheet" />
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-film text-warning"></i> Movie Sensors
      </a>
    </div>
  </nav>

  <main class="container py-5">

    <!-- ✅ 첫 줄: 포스터 + 영화 정보 + 감정분포 -->
    <div class="d-flex flex-column flex-md-row gap-4 mb-4 align-items-start gap-md-20">
      <!-- 포스터 -->
      <div class="poster-placeholder flex-shrink-0">
        <img id="poster" src="" alt="영화 포스터" class="img-fluid rounded d-none" />
        <span id="poster_empty" class="text-muted">포스터 준비 중...</span>
      </div>

      <!-- 영화 정보 -->
      <div class="box movie-info-box">
        <h2 id="title_ko" class="fw-bold text-white mb-3">[영화 제목]</h2>
        <p><strong>장르:</strong> <span id="genres">-</span></p>
        <p><strong>평점:</strong> <span id="rating_value">-</span></p>
        <p><strong>개봉일:</strong> <span id="release_date">-</span></p>

        <div class="bg-sub p-3 mt-3 rounded flex-grow-1">
          <p id="overview" class="text-light">줄거리 로딩 중...</p>
        </div>
      </div>

      <!-- 감정 분석 -->
      <div class="box flex-fill emotion-box justify-content-between">
        <h5 class="text-white mb-3">리뷰 감정 분포</h5>
        <canvas id="emotionChart" width="100%" height="200"></canvas>
        <div class="text-muted small mt-3">
          <div><span class="badge bg-success me-2">&nbsp;</span>긍정적</div>
          <div><span class="badge bg-warning text-dark me-2">&nbsp;</span>보통</div>
          <div><span class="badge bg-danger me-2">&nbsp;</span>부정적</div>
        </div>
      </div>
    </div>

    <!-- ✅ 두 번째 줄: 내 리뷰 + 사람들 리뷰 -->
    <div class="row g-4 mb-4">
      <div class="col-md-6">
        <div class="box h-100">
          <h5 class="text-white mb-3">내 리뷰</h5>
          <input type="text" class="form-control mb-2" id="review_author" placeholder="작성자 이름" />
          <input type="number" class="form-control mb-2" id="review_score" min="0" max="10" step="0.1" placeholder="평점 (숫자)" />
          <textarea id="review_text" class="form-control mb-3" rows="3" placeholder="리뷰를 입력하세요"></textarea>
          <button class="btn btn-gray w-100" id="submit_review">리뷰 등록</button>
        </div>
      </div>
      <div class="col-md-6">
        <div class="box h-100 d-flex flex-column">
          <h5 class="text-white mb-3">사람들 리뷰</h5>

          <div class="review-scroll-box flex-grow-1">
            <div id="review_list">
              <p id="empty_review">아직 리뷰가 없습니다.</p>
            <!-- 리뷰 항목 동적 추가 -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ 세 번째 줄: 추천 영화 -->
    <div class="box">
      <h5 class="text-white mb-3">추천 영화</h5>
      <div class="d-flex justify-content-between flex-wrap" id="recommend_list">
        <!-- <div class="recommend-item bg-secondary"></div>
        <div class="recommend-item bg-secondary"></div>
        <div class="recommend-item bg-secondary"></div>
        <div class="recommend-item bg-secondary"></div>
        <div class="recommend-item bg-secondary"></div> -->
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/search.js"></script>
  <script src="/js/detail_page.js"></script>
</body>
</html>
