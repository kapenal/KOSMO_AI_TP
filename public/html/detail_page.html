<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영화 상세 페이지</title>

  <!-- 외부 라이브러리 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />
  <link href="/css/detail_page.css" rel="stylesheet" />
</head>
<body>

  <!-- ✅ 내비게이션 -->
  <nav class="navbar navbar-expand-lg navbar-dark border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-film text-warning"></i> Movie Sensors
      </a>
    </div>
  </nav>

  <main class="container py-5">

    <!-- ✅ 상단: 포스터 + 정보 -->
    <div class="row g-4 mb-5">
      <div class="col-md-4">
        <div class="box h-100 d-flex align-items-center justify-content-center">
          <!-- ✅ 포스터 placeholder -->
          <div class="poster-placeholder d-flex align-items-center justify-content-center">
            <img id="poster" src="" alt="영화 포스터" class="img-fluid rounded d-none" />
            <span id="poster_empty" class="text-muted">포스터 준비 중...</span>
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <div class="box h-100">
          <h2 id="title_ko" class="fw-bold text-white">[영화 제목]</h2>
          <h5 id="title_en" class="text-secondary mb-3">[영문 제목]</h5>

          <div id="genre_badges" class="mb-3">
            <!-- 예: <span class="badge bg-secondary me-1">액션</span> -->
          </div>

          <div class="mb-2 text-muted">
            <i class="bi bi-calendar3 me-1"></i> <span id="release_date">개봉일: </span>
            <i class="bi bi-clock ms-4 me-1"></i> <span id="runtime">상영시간: </span>
          </div>

          <div class="mb-3 text-white">
            <span class="me-2">평점:</span>
            <span id="rating_value">0.0</span>
          </div>

          <p class="text-white"><strong>감독:</strong> <span id="director">-</span></p>
          <p class="text-white"><strong>출연:</strong> <span id="actors">-</span></p>

          <div class="bg-sub p-3 rounded mt-3">
            <p id="overview" class="text-light">줄거리 로딩 중...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ 중단: 리뷰 작성 + 감정 분포 -->
    <div class="row g-4 mb-5">
      <div class="col-md-4 order-md-2">
        <div class="box h-100">
          <h5 class="text-white mb-3">리뷰 감정 분포</h5>
          <canvas id="emotionChart" width="100%" height="300"></canvas>
          <div class="text-muted small mt-3">
            <div><span class="badge bg-success me-2">&nbsp;</span>긍정적</div>
            <div><span class="badge bg-warning text-dark me-2">&nbsp;</span>보통</div>
            <div><span class="badge bg-danger me-2">&nbsp;</span>부정적</div>
          </div>
        </div>
      </div>

      <div class="col-md-8 order-md-1">
        <div class="box mb-4">
          <h5 class="text-white mb-3">리뷰 작성</h5>
          <input type="text" class="form-control mb-2" id="review_author" placeholder="작성자 이름" />
          <input type="number" class="form-control mb-2" id="review_score" min="0" max="10" step="0.1" placeholder="평점 (숫자)" />
          <textarea id="review_text" class="form-control mb-3" rows="3" placeholder="리뷰를 입력하세요"></textarea>
          <button class="btn btn-gray w-100" id="submit_review">리뷰 등록</button>
        </div>

        <!-- ✅ 기존 리뷰 목록 -->
        <div id="review_list">
          <!-- 스크랩된 리뷰들 여기에 추가됨 -->
        </div>
      </div>
    </div>

    <!-- ✅ 하단: 추천 영화 리스트 -->
    <div class="box mb-4">
      <h5 class="text-white mb-3">추천 영화</h5>
      <div class="d-flex justify-content-between flex-wrap" id="recommend_list">
        <!-- 추천 포스터들 삽입 위치 -->
      </div>
    </div>

  </main>

  <!-- ✅ 스크립트 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/detail_page.js"></script>
</body>
</html>
