<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>영화 챗봇</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
    }

    #chatbox {
      width: 100%;
      max-width: 600px;
      height: 400px;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-y: scroll;
      background-color: white;
    }

    .user {
      text-align: right;
      margin: 5px 0;
      color: #0077cc;
    }

    .bot {
      text-align: left;
      margin: 5px 0;
      color: #333;
    }

    #userInput {
      width: 80%;
      padding: 10px;
      margin-top: 10px;
    }

    #sendBtn {
      padding: 10px;
    }
  </style>
</head>
<body>
  <h2>🎬 영화 챗봇</h2>
  <div id="chatbox"></div>

  <input id="userInput" type="text" placeholder="예: 인셉션 줄거리 알려줘" />
  <button id="sendBtn" onclick="askQuestion()">보내기</button>
    
  <script>
    async function askQuestion() {
      const input = document.getElementById('userInput').value.trim();
if (!input) return;

const chatbox = document.getElementById('chatbox');
chatbox.innerHTML += `<div class="user">${input}</div>`;

document.getElementById('userInput').value = '';

// 전체 입력을 질문으로 보냄
const question = input;
const movie_title = null;  // 필요 시 나중에 FastAPI에서 추출하도록 처리 가능

try {
      const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ movie_title, question }),
        });

        if (!res.ok) {
          chatbox.innerHTML += `<div class="bot">❌ 오류가 발생했습니다. (${res.status})</div>`;
          return;
        }

        const data = await res.json();
        chatbox.innerHTML += `<div class="bot">🎬 ${data.answer}</div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
      } catch (err) {
        chatbox.innerHTML += `<div class="bot">❌ 서버 응답 오류입니다.</div>`;
        console.error(err);
      }
    }

    // Enter 키로도 전송
    document.getElementById('userInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') askQuestion();
    });
  </script>
</body>
</html>
