<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>영화 챗봇</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    body {
      font-family: 'Lato', sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    h2 {
      margin-bottom: 10px;
    }

    /* 채팅 영역 전체 박스 */
    #chat-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
      height: 450px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: white;
      overflow: hidden;
    }

    /* 메시지들이 쌓이는 영역 - 스크롤 유지 */
    #chatbox {
      flex-grow: 1;
      padding: 15px;
      overflow-y: auto;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 사용자 메시지 말풍선 */
    .user {
      align-self: flex-end;
      max-width: 70%;
      background-color: #ffd700;
      color: white;
      padding: 12px 18px;
      border-radius: 20px 20px 3px 20px;
      word-wrap: break-word;
      font-size: 1rem;
    }

    /* 챗봇 메시지 말풍선 */
    .bot {
      align-self: flex-start;
      max-width: 70%;
      background-color: #e0e0e0;
      color: #333;
      padding: 12px 18px;
      border-radius: 20px 20px 20px 3px;
      word-wrap: break-word;
      font-size: 1rem;
    }

    /* 입력 영역 */
    #input-area {
      display: flex;
      padding: 12px 15px;
      border-top: 1px solid #ddd;
      background-color: #fafafa;
    }

    #userInput {
      flex-grow: 1;
      font-size: 1rem;
      padding: 10px 15px;
      border-radius: 20px;
      border: 1px solid #ccc;
      outline: none;
      transition: border-color 0.3s ease;
    }
    #userInput:focus {
      border-color: #ffd700;
    }

    #sendBtn {
      background-color: #ffd700;
      color: white;
      border: none;
      border-radius: 50%; /* 둥근 원형 버튼 */
      width: 44px;
      height: 44px;
      padding: 0;
      margin-left: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }

    #sendBtn:hover {
      background-color: #ffd700;
    }

    #sendBtn i {
      font-size: 1.6rem;
      line-height: 1;
    }
    html, body {
    margin: 0;
    padding: 0;
    overflow: hidden; /* 내부 스크롤 숨기기 */
    height: 100%;
    width: 100%;
    }
    
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="chatbox"></div>
    <div id="input-area">
      <input id="userInput" type="text" placeholder="예: 인셉션 줄거리 알려줘" autocomplete="off" />
        <button id="sendBtn" onclick="askQuestion()" aria-label="전송">
          <i class="bi bi-arrow-right" style="font-size: 1.2rem;"></i>
        </button>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const chatbox = document.getElementById('chatbox');
      const helpMessage = `안녕하세요! Movie Sensors 챗봇입니다. \n궁금한 영화 제목이나 줄거리, 후기 등을 입력해 보세요!`;

      chatbox.innerHTML += `<div class="bot">${helpMessage.replace(/\n/g, '<br>')}</div>`;
      chatbox.scrollTop = chatbox.scrollHeight;
      });
    async function askQuestion() {
      const input = document.getElementById('userInput').value.trim();
      if (!input) return;

      const chatbox = document.getElementById('chatbox');
      // 사용자 메시지 출력
      chatbox.innerHTML += `<div class="user">${input}</div>`;

      document.getElementById('userInput').value = '';
      chatbox.scrollTop = chatbox.scrollHeight;

      // 질문과 영화 제목 (null 고정)
      const question = input;
      const movie_title = null;

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ movie_title, question }),
        });

        if (!res.ok) {
          chatbox.innerHTML += `<div class="bot">❌ 오류가 발생했습니다. (${res.status})</div>`;
          chatbox.scrollTop = chatbox.scrollHeight;
          return;
        }

        const data = await res.json();
        chatbox.innerHTML += `<div class="bot">${data.answer}</div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
      } catch (err) {
        chatbox.innerHTML += `<div class="bot">❌ 서버 응답 오류입니다.</div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
        console.error(err);
      }
    }

    // Enter 키로도 전송
    document.getElementById('userInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') askQuestion();
    });
  </script>
</body>
</html>
