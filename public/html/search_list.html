<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>검색 결과 - Movie Sensors</title>

  <!-- ✅ 라이브러리 불러오기 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />

  <!-- ✅ 사용자 CSS -->
  <link href="/css/search_list.css" rel="stylesheet" />
</head>
<body>

  <!-- ✅ 내비게이션 바 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom">
    <div class="container d-flex justify-content-between">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-film"></i> Movie Sensors
      </a>
    </div>
  </nav>

  <!-- ✅ 검색 섹션 -->
  <section class="search-section">
    <div class="container">
      <h2 class="fw-bold mb-4 text-center">
        <i class="bi bi-film text-warning me-2"></i>Movie Sensors
      </h2>

      <!-- 검색창 -->
      <div class="search-bar">
        <div class="d-flex gap-2 mb-3">
          <input class="form-control" id="search_text" type="text" placeholder="검색어를 입력하세요..." />
          <button class="btn btn-dark" id="search_btn">
            <i class="bi bi-search"></i> 검색
          </button>
        </div>
      </div>

      <!-- ✅ 검색 결과 출력 (렌더링용) -->
      <div id="search_result_container"></div>

    </div>
  </section>

  <!-- ✅ JS 로딩 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ 사용자 JS -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const searchInput = document.getElementById('search_text');
      const searchBtn = document.getElementById('search_btn');
      const container = document.getElementById('search_result_container');

      // ✅ localStorage 에서 검색 결과 불러오기
      const searchData = JSON.parse(localStorage.getItem('searchData'));
      if (searchData && searchData.searchResult) {
        searchInput.value = searchData.input_title || '';
        container.innerHTML = '';

        searchData.searchResult.movies.forEach(movie => {
          // ✅ 카드 HTML 구조 변경됨
          const cardHTML = `
            <a href="/movie/${movie.link}?title=${encodeURIComponent(movie.title)}" style="text-decoration: none;">
              <div class="poster_box"> <!-- ✅ 스타일 통일 -->
                <img class="poster" src="${movie.img}" alt="${movie.title}">
                <div class="title">${movie.title}</div>
                <div class="genre">${movie.genres}</div>
              </div>
            </a>
          `;
          container.insertAdjacentHTML('beforeend', cardHTML);
        });

      } else {
        container.innerHTML = '<p class="text-center text-danger">검색 결과가 없습니다.</p>';
      }

      // ✅ 엔터로 검색 버튼 실행
      if (searchInput) {
        searchInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            if (searchBtn) {
              searchBtn.click();
            }
          }
        });
      }
    });
  </script>

</body>
</html>
