<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>검색 결과 - Movie Sensors</title>

  <!-- ✅ Bootstrap & 아이콘 불러오기 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- ✅ 폰트 및 커스텀 CSS -->
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />
  <link href="/css/search_list.css" rel="stylesheet" />
</head>
<body>

  <!-- ✅ 내비게이션 바 (index.html과 동일) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom">
    <div class="container d-flex justify-content-between">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-film"></i> Movie Sensors
      </a>
    </div>
  </nav>

  <!-- ✅ 검색 섹션 -->
  <section class="search-section">
    <div class="container">

      <!-- 섹션 제목 -->
      <h2 class="fw-bold mb-4 text-center">
        <i class="bi bi-film text-warning me-2"></i>Movie Sensors
      </h2>

      <!-- 검색창 + 버튼 -->
      <div class="search-bar mx-auto" style="width: 700px;">
        <div class="d-flex gap-2 mb-3">
          <input class="form-control" id="search_text" type="text" placeholder="검색어를 입력하세요..." style="height: 60px;" />
          <button class="btn btn-dark" id="search_btn" style="height: 60px; width: 120px;">
            <i class="bi bi-search"></i> 검색
          </button>
          <!-- 임시 디테일 페이지 -->
          <button id="detail_btn" class="btn btn-secondary" style="height: 60px; width: 120px;">
        </div>
      </div>        

    <!-- ✅ 검색 결과 표시 영역 -->
      <div id="search_result_container" class="row g-4"></div>

    </div>
  </section>

  <!-- ✅ JS 라이브러리 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ 사용자 스크립트 -->
  <script src="../js/search.js"></script>
  <script src="../js/detail_page.js"></script>
  <script src="../js/list_page.js"></script>

  <!-- ✅ 검색 결과 렌더링 및 엔터키 이벤트 추가 -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const searchInput = document.getElementById('search_text');
      const searchBtn = document.getElementById('search_btn');
      const container = document.getElementById('search_result_container');

      // 이전 검색 데이터 복원
      const searchData = JSON.parse(localStorage.getItem('searchData'));
      if (searchData && searchData.searchResult) {
        searchInput.value = searchData.input_title || '';
        container.innerHTML = '';
        searchData.searchResult.movies.forEach(movie => {
          const col = document.createElement('div');
          col.className = "col-12 col-sm-6 col-md-4 col-lg-3";
          col.innerHTML = `
            <a href="/movie/${movie.link}" style="text-decoration: none;">
              <div class="movie-card h-100">
                <img src="${movie.img}" alt="${movie.title}">
                <h5 class="mt-2">${movie.title}</h5>
                <p class="text-muted small">${movie.genres}</p>
              </div>
            </a>`;
          container.appendChild(col);
        });
      } else {
        container.innerHTML = '<p class="text-center text-danger">검색 결과가 없습니다.</p>';
      }

      // 엔터키 누르면 검색 버튼 클릭
      if (searchInput) {
        searchInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            if (searchBtn) {
              searchBtn.click();
            }
          }
        });
      }
    });
  </script>

</body>
</html>
